# Shared 15.6GB machine (several agents + emulator): cap daemon memory and lifetime (#45).
# ParallelGC: lower overhead/footprint than G1 for short-lived build JVMs (Android docs recommend it).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=600000
# Kotlin daemon already stops with the Gradle daemon; its own 2h idle timeout has no documented property, so none is set.
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=true
# Bound concurrent workers so parallel tasks do not multiply heap/CPU use.
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
