# Shared 15.6GB machine (several agents + emulator): cap daemon memory and lifetime (#45).
# ParallelGC: lower overhead/footprint than G1 for short-lived build JVMs (Android docs recommend it).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dkotlin.daemon.options=autoshutdownIdleSeconds=600 -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=600000
# Kotlin daemon idle shutdown defaults to 2h; autoshutdownIdleSeconds=600 (kotlin.daemon.options in jvmargs above) lowers it to 10 min.
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=true
# Per-build concurrency limit on parallel workers, so tasks do not multiply heap/CPU use.
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
