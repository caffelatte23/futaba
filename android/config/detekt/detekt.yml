build:
  maxIssues: 0

style:
  MagicNumber:
    excludes:
      - '**/core/designsystem/**'
      - '**/test/**'
      - '**/androidTest/**'
  # Color literals belong in core/designsystem only. Requires type resolution (detekt* tasks with classpath).
  ForbiddenMethodCall:
    active: true
    excludes:
      - '**/core/designsystem/**'
    methods:
      - value: 'androidx.compose.ui.graphics.Color(kotlin.Long)'
        reason: 'Define colors in core/designsystem (FutabaColors) only.'
      - value: 'androidx.compose.ui.graphics.Color(kotlin.Int)'
        reason: 'Define colors in core/designsystem (FutabaColors) only.'
      - value: 'androidx.compose.ui.graphics.Color(kotlin.Int, kotlin.Int, kotlin.Int, kotlin.Int)'
        reason: 'Define colors in core/designsystem (FutabaColors) only.'
      - value: 'androidx.compose.ui.graphics.Color(kotlin.Float, kotlin.Float, kotlin.Float, kotlin.Float, androidx.compose.ui.graphics.colorspace.ColorSpace)'
        reason: 'Define colors in core/designsystem (FutabaColors) only.'

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  Material2:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  UnstableCollections:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
